[project]
name = "fixtureforge"
version = "0.2.0"
description = "Compile DataHub metadata into deterministic source-row-free test assets."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "Apache-2.0" }
authors = [{ name = "FixtureForge Contributors" }]
dependencies = [
  "duckdb>=1.3,<2",
  "mcp>=1.13,<2",
  "pydantic>=2.11,<3",
  "pyyaml>=6.0,<7",
  "rich>=14,<15",
  "typer>=0.16,<1",
]

[project.scripts]
fixtureforge = "fixtureforge.cli:app"

[dependency-groups]
dev = [
  "hypothesis>=6.138,<7",
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
  "types-PyYAML>=6.0,<7",
]
datahub = [
  "acryl-datahub[datahub-rest]>=1.1,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fixtureforge"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.ruff.lint.per-file-ignores]
"src/fixtureforge/reporting.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["fixtureforge"]

[tool.coverage.run]
branch = true
source = ["fixtureforge"]
omit = [
  "src/fixtureforge/cli.py",
]

[tool.coverage.report]
fail_under = 90
show_missing = true
